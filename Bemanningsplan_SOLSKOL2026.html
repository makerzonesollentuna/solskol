function TaskRow({task}) {
  const bg = task.flower ? "background:#f3e8ff;border:1px solid #d8b4fe" : "background:rgba(255,255,255,0.8);border:1px solid #f1f5f9";
  return e("div", {className:"task", style:{cssText:bg}},
    e("div", {className:"task-title"}, task.task),
    task.who ? e("div", {className:"task-who"}, task.who) : null,
    e("div", {style:{display:"flex",gap:"12px",flexWrap:"wrap",marginTop:"2px"}},
      task.time ? e("span", {className:"task-time"}, task.time) : null,
      task.note ? e("span", {className:"task-note"}, task.note) : null,
    )
  );
}

function TimeBlock({block, searchQuery}) {
  const style = TYPE_STYLE[block.type] || TYPE_STYLE.break;
  const q = searchQuery ? searchQuery.toLowerCase() : "";
  const visibleTasks = !q ? block.tasks : block.tasks.filter(t =>
    [t.task, t.who||"", t.note||""].some(s => s.toLowerCase().includes(q))
  );
  const blockMatches = q && [block.label, block.time].some(s => s.toLowerCase().includes(q));
  const tasksToShow = blockMatches ? block.tasks : visibleTasks;
  if (q && tasksToShow.length === 0) return null;
  return e("div", {className:"block", style:{border:"1px solid "+style.border, background:style.bg}},
    e("div", {className:"block-header"},
      e("span", {className:"badge", style:{cssText:style.badge}}, block.time),
      e("span", {className:"block-label"}, block.label)
    ),
    e("div", {style:{padding:"0 12px 8px"}},
      tasksToShow.map((task, i) => e(TaskRow, {key:i, task}))
    )
  );
}

  return e("div", {style:{minHeight:"100vh",background:"#f8fafc"}},
    e("header", {style:{position:"sticky",top:0,zIndex:50,background:"rgba(255,255,255,0.97)",backdropFilter:"blur(8px)",borderBottom:"1px solid #e2e8f0",boxShadow:"0 1px 3px rgba(0,0,0,0.05)"}},
      e("div", {style:{maxWidth:"1024px",margin:"0 auto",padding:"8px 12px"}},
        e("div", {style:{display:"flex",alignItems:"center",justifyContent:"space-between"}},
          e("div", null,
            e("h1", {style:{fontSize:"18px",fontWeight:"700",color:"#1e293b",margin:0}}, "SOLSKOL 2026 — Bemanningsplan"),
            e("p", {style:{fontSize:"12px",color:"#94a3b8",margin:0}}, "Sök på namn för att hitta en persons uppdrag")
          )
        ),
        e("div", {style:{display:"flex",gap:"4px",marginTop:"8px",overflowX:"auto",paddingBottom:"4px"}},
          TABS.map(t => e("button", {
            key:t.id,
            className:"tab-btn"+(tab===t.id?" active":""),
            onClick:()=>{setTab(t.id);setSearchValue("");}
          }, t.label))
        )
      )
    ),
    e("main", {style:{maxWidth:"1024px",margin:"0 auto",padding:"12px",paddingBottom:"64px"}},
      tab==="timeline"     ? e(TabTimeline, {searchQuery:searchValue, setSearchQuery:setSearchValue}) : null,
      tab==="instructions" ? e(TabInstructions, null) : null,
      tab==="personal"     ? e(TabPersonal, null) : null,
      tab==="moblering"    ? e(TabMoblering, null) : null,
      tab==="info"         ? e(TabInfo, null) : null
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App, null));
</script>
</body>
</html>
