// ─── TASK ROW ─────────────────────────────────────────────────────────────────
function TaskRow({ task }) {
  const rowBg = task.flower ? "bg-purple-100/70 border-purple-200" : "bg-white/80 border-slate-100";
  return (
    <div className={`rounded p-2 text-xs ${rowBg} border`}>
      <div className="font-semibold text-slate-800 mb-0.5">{task.task}</div>
      {task.who && <div className="text-blue-700">{task.who}</div>}
      <div className="flex gap-3 mt-0.5 flex-wrap">
        {task.time && <span className="text-slate-500">{task.time}</span>}
        {task.note && <span className="text-slate-400 italic">{task.note}</span>}
      </div>
    </div>
  );
}

// ─── TIME BLOCK ───────────────────────────────────────────────────────────────
function TimeBlock({ block, searchQuery }) {
  const style = TYPE_STYLE[block.type] || TYPE_STYLE.break;
  const q = searchQuery ? searchQuery.toLowerCase() : "";
  const visibleTasks = !q
    ? block.tasks
    : block.tasks.filter(t =>
        [t.task, t.who || "", t.note || ""].some(s => s.toLowerCase().includes(q))
      );
  const blockMatches = q && [block.label, block.time].some(s => s.toLowerCase().includes(q));
  const tasksToShow = blockMatches ? block.tasks : visibleTasks;
  if (q && tasksToShow.length === 0) return null;
  return (
    <div className={`rounded-lg border ${style.border} ${style.bg} overflow-hidden`}>
      <div className="px-3 py-2 flex items-center gap-2 flex-wrap">
        <span className={`px-2 py-0.5 rounded-full text-xs font-bold ${style.badge}`}>{block.time}</span>
        <span className="text-sm font-semibold text-slate-700">{block.label}</span>
      </div>
      <div className="px-3 pb-2 space-y-1">
        {tasksToShow.map((task, i) => <TaskRow key={i} task={task} />)}
      </div>
    </div>
  );
}

      <header className="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
        <div className="max-w-5xl mx-auto px-3 py-2">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <div>
              <h1 className="text-lg font-bold text-slate-800">SOLSKOL 2026 — Bemanningsplan</h1>
              <p className="text-xs text-slate-400">Sök på namn för att hitta en persons uppdrag</p>
            </div>
          </div>
          <div className="flex gap-1 mt-2 overflow-x-auto pb-1">
            {TABS.map(t => (
              <button key={t.id} onClick={() => { setTab(t.id); setSearchValue(""); }}
                className="px-3 py-1 rounded-t text-xs font-semibold whitespace-nowrap transition-colors"
                style={{ background: tab === t.id ? "#1d4ed8" : "transparent", color: tab === t.id ? "#fff" : "#94a3b8" }}>
                {t.label}
              </button>
            ))}
          </div>
        </div>
      </header>
      <main className="max-w-5xl mx-auto px-3 py-3 pb-16">
        {tab === "timeline"     && <TabTimeline searchQuery={searchValue} setSearchQuery={setSearchValue} />}
        {tab === "instructions" && <TabInstructions />}
        {tab === "personal"     && <TabPersonal />}
        {tab === "moblering"    && <TabMoblering />}
        {tab === "info"         && <TabInfo />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
